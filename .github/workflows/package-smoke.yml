name: Package smoke (all OSs)

# The package as users get it, on every platform: the packed tarball installed with npm under Node alone (no Bun),
# the server driven over stdio as a client would (scripts/ci/smoke-mcp.mjs), and the plugins' own launch command
# (the alias form in mcp.json) run from a checkout of this repository, through a one-package registry
# (scripts/ci/smoke-registry.mjs). A Node without node:sqlite fails with the named cause, and with Bun on PATH it
# re-execs into Bun. SPEC §runtime, README §agent-plugins.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The submodule is public over https (.gitmodules), so the default token fetches it.
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: bun install --frozen-lockfile && bun run build

      - name: Pack
        run: mkdir -p pack && npm pack --pack-destination pack

      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: pack/*.tgz

  smoke:
    needs: pack
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: pack

      - name: No Bun on this runner
        run: |
          if command -v bun; then echo "bun is on PATH; this job checks Node alone"; exit 1; fi
          node -e "require('node:sqlite')" && node --version

      - name: Install from the tarball, as users do
        run: npm install -g ./pack/*.tgz

      - name: The bins start under Node
        run: |
          metabob-mcp --version
          mcp --version
          head -1 "$(npm root -g)/@metabob/mcp/dist/cli.js" | grep -qx '#!/usr/bin/env node'

      - name: Windows shim dispatches to node
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $shim = Join-Path (npm root -g | Split-Path -Parent) "metabob-mcp.cmd"
          if (-not (Test-Path $shim)) { throw "no metabob-mcp.cmd shim at $shim" }
          if ((Get-Content $shim -Raw) -notmatch 'node') { throw "the shim does not dispatch to node" }
          & cmd /c "metabob-mcp --version"
          if ($LASTEXITCODE -ne 0) { throw "cmd.exe invocation exited $LASTEXITCODE" }

      - name: The server under Node, driven over stdio
        run: >-
          node scripts/ci/smoke-mcp.mjs --cwd "$RUNNER_TEMP" --expect runtime=node --expect default-tools -- metabob-mcp
          && node scripts/ci/smoke-mcp.mjs --cwd "$RUNNER_TEMP" --env METABOB_TOOLS=all --expect local-tools -- metabob-mcp

      - name: The plugins' launch command, from a checkout of this repository
        run: |
          # The checkout's package.json has the package's name and version, as a plugin cache does: the launcher must
          # still fetch the package, and the server, started in the plugin's folder, must wait for init_workspace.
          node -e "const a=require('./mcp.json').mcpServers.metabob.args, b=require('./plugin/.mcp.json').mcpServers.metabob.args; if (JSON.stringify(a)!==JSON.stringify(b)) { console.error('the two bundles launch differently'); process.exit(1) }"
          node scripts/ci/smoke-registry.mjs pack/*.tgz 4874 &
          for i in $(seq 1 30); do node -e "fetch('http://127.0.0.1:4874/@metabob%2fmcp').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))" && break; [ "$i" = 30 ] && { echo "the smoke registry did not answer"; exit 1; }; sleep 1; done
          printf '@metabob:registry=http://127.0.0.1:4874/\n' > "$RUNNER_TEMP/npmrc"
          args=$(node -p "require('./mcp.json').mcpServers.metabob.args.join(' ')")
          echo "npx $args"
          # The first launch installs the package: it too must answer within a client's 30 s connect timeout.
          npm_config_userconfig="$RUNNER_TEMP/npmrc" node scripts/ci/smoke-mcp.mjs \
            --env PLUGIN_ROOT="$GITHUB_WORKSPACE" --expect undetermined --expect default-tools --expect runtime=node --init-under 30000 -- npx $args
          # A reconnect: the same launch with the package cached must answer within a client's 30 s connect timeout.
          npm_config_userconfig="$RUNNER_TEMP/npmrc" node scripts/ci/smoke-mcp.mjs \
            --env PLUGIN_ROOT="$GITHUB_WORKSPACE" --expect undetermined --init-under 30000 -- npx $args

  older-node:
    needs: pack
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: [false, true]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - if: matrix.bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/download-artifact@v4
        with:
          name: tarball
          path: pack

      - name: Bun is on PATH only where the job asks for it
        run: |
          if [ "${{ matrix.bun }}" = "true" ]; then bun --version; elif command -v bun; then echo "bun is on PATH"; exit 1; fi
          if node -e "require('node:sqlite')" 2>/dev/null; then echo "this Node has node:sqlite; the job needs one without"; exit 1; fi

      - name: Install from the tarball
        run: npm install -g ./pack/*.tgz

      - name: Without Bun, the server names both fixes and exits 1
        if: ${{ !matrix.bun }}
        run: |
          set +e
          out=$(metabob-mcp < /dev/null 2>&1); code=$?
          set -e
          echo "$out"
          [ "$code" = "1" ] || { echo "expected exit 1, got $code"; exit 1; }
          echo "$out" | grep -q "runtime_unsupported"
          metabob-mcp --version

      - name: With Bun, the server re-execs into it
        if: matrix.bun
        run: node scripts/ci/smoke-mcp.mjs --cwd "$RUNNER_TEMP" --env METABOB_TOOLS=all --expect runtime=bun --expect local-tools -- metabob-mcp
