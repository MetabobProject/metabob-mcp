name: CI

on:
  push:
    branches: [dev]
  # Feature work lands via PRs into dev (see CLAUDE.md § Branching), and main
  # only ever receives commits already merged there. Testing PRs into main alone
  # therefore ran CI strictly after the decision it exists to inform. Include
  # dev so a branch is checked while it is still under review.
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.AUTOMATION_PAT }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Doc links
        # docs ↔ code citations (docs/DOCLINKS.md); errors exit 1, drift warnings print.
        # tests/unit/doclinks.test.ts runs the same check, plus its own guards, below.
        run: bun scripts/doclinks.mjs check

      - name: Unit tests
        run: bun test --timeout 30000 tests/unit/

      - name: Integration tests
        run: bun test --timeout 30000 tests/integration/
        env:
          SESSION_ID: ci-test-session
          LOG_LEVEL: error

      - name: Build
        run: bun run build

      - name: Workflow tests
        # The agent workflows end to end against an in-process fake substrate,
        # driving the built dist/cli.js (tests/workflows/README.md).
        run: bun test --timeout 30000 tests/workflows/
        env:
          MCP_UNDER_TEST: dist
